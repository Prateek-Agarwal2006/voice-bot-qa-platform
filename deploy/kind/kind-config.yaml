# kind cluster config — maps UI NodePort 30090 to the host.
# Create with:
#   kind create cluster --name voicebot-qa --config deploy/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
