{{/*
  Only render this Secret when postgresDsn is provided in values (production flow).
  For kind/local, the secret is pre-created by deploy/kind/create-secrets.sh
  and Helm should not touch it.
*/}}
{{- if .Values.secrets.postgresDsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "voicebot-qa.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.secrets.postgresDsn | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "" | quote }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenLabsApiKey | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openAiApiKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | default "" | quote }}
  VERTEXAI_PROJECT: {{ .Values.secrets.vertexAiProject | default "" | quote }}
  VERTEXAI_LOCATION: {{ .Values.secrets.vertexAiLocation | default "" | quote }}
  GCP_SA_JSON: {{ .Values.secrets.gcpSaJson | default "" | quote }}
{{- end }}
