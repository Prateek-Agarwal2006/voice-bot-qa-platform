apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voicebot-qa.fullname" . }}-orchestrator
  labels:
    {{- include "voicebot-qa.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      {{- include "voicebot-qa.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "voicebot-qa.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: "{{ .Values.image.orchestrator.repository }}:{{ .Values.image.orchestrator.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.port }}
          env:
            - name: CONFIG_PATH
              value: /config/config.json
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: ORCHESTRATOR_BASE_URL
              value: {{ printf "http://%s-orchestrator:%v" (include "voicebot-qa.fullname" .) .Values.orchestrator.port | quote }}
            {{- include "voicebot-qa.postgresEnv" . | nindent 12 }}
          volumeMounts:
            - name: probe-config
              mountPath: /config
              readOnly: true
            - name: upload-staging
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: probe-config
          configMap:
            name: {{ include "voicebot-qa.fullname" . }}-orchestrator-config
        - name: upload-staging
          emptyDir: {}
