# Kind / Colima local simulation — run deploy/kind/build-and-load.sh first.
# Postgres runs as a pod inside the cluster. DNS: postgres-svc:5432 (same as prod).

image:
  pullPolicy: Never
  probeWorker:
    repository: voicebot-qa-probe-worker
    tag: local
  evalWorker:
    repository: voicebot-qa-eval-worker
    tag: local
  orchestrator:
    repository: voicebot-qa-orchestrator
    tag: local
  ui:
    repository: voicebot-qa-ui
    tag: local
  postgres:
    repository: postgres
    tag: "16-alpine"

global:
  collectIntervalSeconds: 120

evalWorker:
  replicas: 1
  # Backup poll only — primary wake-up is Postgres LISTEN/NOTIFY on eval_jobs.
  pollIntervalSeconds: 60

secrets:
  name: voicebot-qa-secrets
  # postgresDsn + API keys + optional Vertex fields via create-secrets.sh

# Set true after create-secrets.sh has VERTEXAI_* + VERTEX_SA_JSON_FILE
vertex:
  enabled: false

service:
  ui:
    type: NodePort
    nodePort: 30090
